<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graduation Memories</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Graduation day</p>
          <h1>Memories & Vibes</h1>
        </div>

        <nav class="tabs" aria-label="Views">
          <button class="tab active" type="button" data-view="stage">Stage</button>
          <button class="tab" type="button" data-view="gallery">Wall</button>
          <button class="tab" type="button" data-view="match">Match</button>
          <button class="tab" type="button" data-view="vibes">Vibes</button>
          <button class="tab" type="button" data-view="awards">Awards</button>
        </nav>

        <section class="mood-panel" aria-label="Vibe mode">
          <button class="mood-button active" type="button" data-mood="sunset">Sunset</button>
          <button class="mood-button" type="button" data-mood="midnight">Midnight</button>
          <button class="mood-button" type="button" data-mood="campus">Campus</button>
        </section>

        <section class="score-panel" aria-label="Game score">
          <div>
            <span>Matches</span>
            <strong id="matchScore">0</strong>
          </div>
          <div>
            <span>Crew</span>
            <strong id="friendTotal">0</strong>
          </div>
        </section>
      </aside>

      <section class="content">
        <section class="view active" id="stage">
          <div class="stage-scene">
            <div class="stage-copy">
              <p class="eyebrow">Class friends</p>
              <h2>One day, many memories</h2>
              <p class="stage-line" id="stageLine"></p>
              <div class="stage-actions">
                <button class="icon-button dark" id="spinSpotlight" type="button">Spotlight</button>
                <button class="icon-button" id="confettiButton" type="button">Confetti</button>
              </div>
            </div>
            <div class="spotlight-card">
              <div class="spotlight-glow"></div>
              <img id="spotlightAvatar" alt="">
              <div class="spotlight-caption">
                <span id="spotlightRole"></span>
                <strong id="spotlightName"></strong>
              </div>
            </div>
          </div>
          <div class="lineup-stage" id="lineupStage"></div>
          <div class="memory-reel" id="memoryReel"></div>
        </section>

        <section class="view" id="gallery">
          <div class="toolbar">
            <h2>Yearbook Wall</h2>
            <button class="icon-button" id="shuffleGallery" type="button" title="Shuffle gallery">Shuffle</button>
          </div>
          <div class="friend-grid" id="friendGrid"></div>
        </section>

        <section class="view" id="match">
          <div class="toolbar">
            <h2>Memory Match</h2>
            <button class="icon-button" id="resetMatch" type="button" title="Reset match game">Reset</button>
          </div>
          <div class="match-board" id="matchBoard"></div>
        </section>

        <section class="view" id="vibes">
          <div class="toolbar">
            <h2>Vibe Check</h2>
            <button class="icon-button" id="newVibe" type="button" title="New vibe round">New vibe</button>
          </div>
          <div class="vibe-layout">
            <article class="vibe-card">
              <span id="vibeRound">Round 1</span>
              <strong id="vibeTitle"></strong>
              <p id="vibeBrief"></p>
              <div class="vibe-meter"><span id="vibeMeter"></span></div>
            </article>
            <div class="vibe-picks" id="vibePicks"></div>
            <div class="vibe-pool" id="vibePool"></div>
          </div>
        </section>

        <section class="view" id="awards">
          <div class="toolbar">
            <h2>Friend Awards</h2>
            <button class="icon-button" id="rerollAwards" type="button" title="Reroll awards">Reroll</button>
          </div>
          <div class="award-grid" id="awardGrid"></div>
        </section>

      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
